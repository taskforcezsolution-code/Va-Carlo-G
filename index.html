#intro{--lw:clamp(210px,44vmin,400px);--pd:clamp(150px,32vmin,290px);position:fixed;inset:0;z-index:2147483000;background:#fff;color:#1D1D1F;-webkit-font-smoothing:antialiased;transition:background-color 1000ms ease;overflow:hidden}
#intro *{box-sizing:border-box;margin:0;padding:0;border:0}
#intro.go{background-color:rgba(255,255,255,0);pointer-events:none}
#intro .stage{position:absolute;inset:0;display:grid;place-items:center;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
#intro .scene{perspective:1600px;opacity:0;transform:scale(.92);transition:opacity .7s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
#intro .scene.in{opacity:1;transform:none}
#intro .flip{position:relative;width:var(--lw);height:calc(var(--lw)*1.2);transform-style:preserve-3d;transition:transform 1.2s cubic-bezier(.6,0,.2,1)}
#intro .flip.back{transform:rotateY(180deg)}
#intro .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
#intro .logo{display:flex;flex-direction:column;align-items:center;gap:calc(var(--lw)*.07)}
#intro .mark{width:100%;height:calc(var(--lw)*1.0024);overflow:visible;display:block}
#intro .mark .fl{fill:#32312F;opacity:0}
#intro .mark .st,#intro .mark .sd{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
#intro .mark .sd{stroke:#8B0A1A;stroke-width:13}
#intro .mark .st{stroke:#FF2D4D;stroke-width:5;filter:drop-shadow(0 0 5px rgba(255,30,70,.95)) drop-shadow(0 0 14px rgba(255,0,50,.65))}
#intro .scene.in .mark .fl{animation:ilf .9s ease 1.3s forwards}
#intro .scene.in .mark .st{animation:ils 2.4s ease-in-out forwards,ilc 1s ease 2.2s forwards}
#intro .scene.in .mark .sd{animation:ils 2.4s ease-in-out forwards,ilcd 1s ease 2.2s forwards}
#intro .wm{width:calc(var(--lw)*.9);height:auto;opacity:0;transform:translateY(8px)}
#intro .scene.in .wm{animation:ilw .8s ease 2.4s forwards}
@keyframes ils{0%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}
@keyframes ilc{0%{stroke:#FF2D4D;filter:drop-shadow(0 0 5px rgba(255,30,70,.95)) drop-shadow(0 0 14px rgba(255,0,50,.65))}100%{stroke:#32312F;filter:none}}
@keyframes ilcd{0%{stroke:#8B0A1A}100%{stroke:#32312F}}
@keyframes ilf{0%{opacity:0}100%{opacity:1}}
@keyframes ilw{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
#intro .back-face{transform:rotateY(180deg);display:grid;place-items:center}
#intro .pface{width:var(--pd);height:var(--pd);border-radius:50%;background:#e9edf3 center/cover no-repeat;border:6px solid #eef0f4}
#intro .ref{position:absolute;left:50%;top:50%;width:var(--pd);height:var(--pd);margin:calc(var(--pd)/-2) 0 0 calc(var(--pd)/-2);pointer-events:none;visibility:hidden}
#intro .tagw{position:absolute;left:calc(50% + var(--pd)/2 + 4px);top:50%;transform:translateY(-50%);clip-path:inset(-40px -160px -40px 0)}
#intro .tag{white-space:nowrap;padding-left:.7em;font:600 clamp(24px,4.8vmin,46px)/1.2 "PlayfairEmb","Playfair Display",Georgia,serif;letter-spacing:-.005em;color:#1D1D1F;transform:translateX(-110%);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
#intro .tag.show{transform:none}
#intro{--bounce:cubic-bezier(.34,1.56,.64,1)}
@supports (transition-timing-function:linear(0,1)){#intro{--bounce:linear(0,.0833 5.6%,.2603 11.1%,.4566 16.7%,.6331 22.2%,.7737 27.8%,.8759 33.3%,.9442 38.9%,.9858 44.4%,1.0081 50%,1.0178 55.6%,1.0199 61.1%,1.018 66.7%,1.0143 72.2%,1.0104 77.8%,1.007 83.3%,1.0043 88.9%,1.0023 94.4%,1 100%)}}
#intro .tag .em{display:inline-block;margin:0 .1em 0 .2em;transform-origin:left center}
#intro .tag.show .em{animation:iem 4.4s var(--bounce) .9s infinite}
#intro .tag.show .o{animation:idm 4.4s ease .9s infinite}
@keyframes iem{0%,14%{transform:scale(1);color:#1D1D1F}32%,72%{transform:scale(1.34);color:#FF2D4D}88%,100%{transform:scale(1);color:#1D1D1F}}
@keyframes idm{0%,14%{color:#1D1D1F}32%,72%{color:#66666B}88%,100%{color:#1D1D1F}}
html.intro-on .avatar{visibility:hidden}
.ia-fly{position:fixed;z-index:2147483001;border-radius:50%;pointer-events:none;box-sizing:border-box;will-change:left,top,width,height}
</style>
<script>if(!matchMedia("(prefers-reduced-motion: reduce)").matches)document.documentElement.classList.add("intro-on")</script>
<style id="cb-css">
.cb-note{margin:0;color:var(--mute);font-size:13px}
.cb-btn{font-size:14px;padding:10px 22px}
.cb-sec{margin:44px 0 0}
.cb-sec .eb{font:600 12px/1 "Geist",system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#8b0000;margin:0 0 12px}
.cb-h{font:650 clamp(24px,3.2vw,36px)/1.2 "Geist",system-ui,sans-serif;letter-spacing:-.035em;margin:0 0 10px;max-width:26em}
.cb-sub{color:var(--mute);font-size:16px;line-height:1.55;max-width:66ch;margin:0 0 18px}
.cb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.cb-card h3{font-size:17px;line-height:1.3;margin:6px 0 8px;font-weight:600}
.cb-card p{margin:0;color:var(--mute);font-size:14px;line-height:1.55}
.cb-n{color:#8b0000;font:650 13px/1 "Geist",system-ui,sans-serif;letter-spacing:.08em}
.cb-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:stretch}
.cb-prog{display:flex;flex-direction:column}
.cb-tag{align-self:flex-start;display:inline-block;background:rgba(139,0,0,.1);color:#8b0000;font:600 11px/1 "Geist",system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:6px 10px;margin-bottom:10px}
.cb-tag.sm{margin:0 0 0 6px;padding:4px 8px;font-size:10px;vertical-align:middle}
.cb-ph{font:650 22px/1.25 "Geist",system-ui,sans-serif;letter-spacing:-.02em;margin:0 0 8px}
.cb-for{margin:0 0 8px;font-weight:600;font-size:14px}
.cb-ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px}
.cb-ul li{position:relative;padding-left:22px;font-size:14px;line-height:1.5;color:var(--ink)}
.cb-ul li::before{content:"";position:absolute;left:3px;top:.55em;width:6px;height:6px;border-radius:50%;background:#8b0000;opacity:.55}
.cb-ul.ck li::before{content:"✓";width:auto;height:auto;background:none;border-radius:0;top:0;left:0;color:#8b0000;font-weight:700;opacity:1}
.cb-tw{overflow-x:auto;border-radius:8px}
.cb-t{width:100%;min-width:680px;border-collapse:collapse;font-size:14px;background:var(--glass);border:1px solid var(--glassb)}
.cb-t th,.cb-t td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.cb-t thead th{font-weight:650;font-size:13px;white-space:nowrap}
.cb-t tbody th{font-weight:550}
.cb-t td{color:var(--mute)}

rm's algorithm rewards right now — hook structure, caption format, hashtags, posting time, and trending audio selection.</p></div></div></section><section class="cb-sec"><p class="eb">What I produce</p><h2 class="cb-h">Eight video formats. One content workflow.</h2><p class="cb-sub">From raw footage editing to fully AI-generated video — every format serves a different business goal and audience preference.</p><div class="cb-grid"><div class="card cb-card"><span class="cb-n">01</span><h3>Instagram Reels &amp; TikTok</h3><p>Hook-first short-form video (15–60 sec) optimised for reach and follower growth — the highest-return video format for organic audience building.</p><span class="cb-tag sm" style="margin:10px 0 0">Highest organic reach</span></div><div class="card cb-card"><span class="cb-n">02</span><h3>YouTube Shorts</h3><p>Vertical short-form videos for YouTube's algorithm — building a subscriber base that compounds long-term alongside your existing content.</p></div><div class="card cb-card"><span class="cb-n">03</span><h3>LinkedIn Video</h3><p>Talking-head or text-motion video for LinkedIn's professional audience — thought leadership that drives connection requests and enquiries.</p></div><div class="card cb-card"><span class="cb-n">04</span><h3>Content Repurposing</h3><p>Turn one long-form recording — webinar, podcast, coaching call, or YouTube video — into 8–12 platform-optimised short clips automatically.</p></div><div class="card cb-card"><span class="cb-n">05</span><h3>AI Avatar Video</h3><p>Fully AI-generated videos using a digital avatar — no camera, no filming. Script it, generate it, post it. Ideal for camera-shy creators at scale.</p></div><div class="card cb-card"><span class="cb-n">06</span><h3>Voiceover &amp; Slideshow</h3><p>Narrated slide or image videos — your voice over branded visuals, captions, and motion graphics. High-value educational content without on-camera presence.</p></div><div class="card cb-card"><span class="cb-n">07</span><h3>Screen Recording &amp; Tutorial</h3><p>Software walkthroughs, tool demos, and educational tutorials — edited with branded overlays, animated callouts, and chapter markers.</p></div><div class="card cb-card"><span class="cb-n">08</span><h3>Ad Creative Video</h3><p>Short-form video ads for Facebook, Instagram, TikTok, and YouTube — hook in the first 2 seconds, offer clear, CTA compelling. Built to convert, not just inform.</p></div></div></section><section class="cb-sec"><p class="eb">What's included</p><h2 class="cb-h">Strategy to final file. All handled.</h2><p class="cb-sub">Every video project or monthly retainer covers all four phases — nothing is left half-finished or handed back for you to figure out.</p><div class="cb-grid cb-inc"><div class="card cb-card"><span class="cb-ico">🎯</span><h3>Strategy &amp; Content Planning</h3><ul class="cb-ul"><li>Video content strategy aligned to your business goals and audience</li><li>Platform selection — which formats belong on which channel</li><li>Monthly video content calendar with topics, hooks, and formats</li><li>Trend research and algorithm-aware scheduling recommendations</li><li>Repurposing plan — mapping existing content to short-form clips</li><li>Competitor video analysis and content gap identification</li></ul></div><div class="card cb-card"><span class="cb-ico">✍️</span><h3>Scripting &amp; Copywriting</h3><ul class="cb-ul"><li>Hook writing — the first 2 seconds that stop the scroll</li><li>Full video scripts written in your voice and pacing</li><li>Caption and on-screen text written for readability</li><li>Auto-caption review and correction for accuracy</li><li>Hashtag research and platform-specific copy optimisation</li><li>CTA scripting — driving comments, saves, clicks, or DMs</li></ul></div><div class="card cb-card"><span class="cb-ico">✂️</span><h3>Editing &amp; Production</h3><ul class="cb-ul"><li>Raw footage editing — cuts, pacing, and flow optimisation</li><li>Captions, subtitles, and animated text overlay t to build them.</h2><p class="cb-sub">From simple lead magnets to interactive digital books — every format serves a different business goal. Here's how to choose.</p><div class="cb-grid"><div class="card cb-card"><span class="cb-ico">🧲</span><h3>Lead Magnet Guide</h3><p>A focused, value-packed PDF that solves one specific problem for your ideal client — in exchange for their email address.</p></div><div class="card cb-card"><span class="cb-ico">🗃️</span><h3>Framework &amp; Methodology eBook</h3><p>A longer-form book that documents your proprietary process, framework, or approach — positioning you as the definitive expert in your field.</p></div><div class="card cb-card"><span class="cb-ico">📚</span><h3>Workbook &amp; Action Guide</h3><p>An interactive PDF with fillable fields, exercises, and worksheets — readers get practical transformation, not just information.</p></div><div class="card cb-card"><span class="cb-ico">📑</span><h3>Interactive Flipbook</h3><p>A digital flipbook with page-turn animation for online distribution — professional, shareable, and memorable. Ideal for premium lead magnets and brand positioning.</p></div><div class="card cb-card"><span class="cb-ico">📃</span><h3>Industry Report / Whitepaper</h3><p>A data-driven, research-backed document for B2B brands — demonstrates authority, earns media mentions, and attracts high-value clients.</p></div><div class="card cb-card"><span class="cb-ico">📙</span><h3>Course Companion eBook</h3><p>A professionally designed supplementary guide for your online course or academy — increases perceived value, improves completion rates, and strengthens results.</p></div></div></section><section class="cb-sec"><p class="eb">What's included</p><h2 class="cb-h">Writing and design. Both. Together.</h2><p class="cb-sub">Every eBook project covers all four phases — strategy, writing, design, and delivery. Nothing is handed back half-finished for you to figure out.</p><div class="cb-grid cb-inc"><div class="card cb-card"><span class="cb-ico">🎯</span><h3>Strategy &amp; Structure</h3><ul class="cb-ul"><li>Audience and goal definition before writing begins</li><li>Topic and angle selection for maximum conversion</li><li>Chapter outline and table of contents planning</li><li>Hook and headline strategy for the cover and intro</li><li>CTA placement strategy within the eBook itself</li></ul></div><div class="card cb-card"><span class="cb-ico">📝</span><h3>Writing &amp; Copywriting</h3><ul class="cb-ul"><li>Full eBook written in your voice from scratch</li><li>Introduction, all chapters, and conclusion</li><li>Engaging, readable prose — not academic or dry</li><li>Pull quotes, callout boxes, and summary panels</li><li>Strategic CTAs woven naturally through the content</li><li>Proofreading and final copy polish</li></ul></div><div class="card cb-card"><span class="cb-ico">🖌️</span><h3>Design &amp; Layout</h3><ul class="cb-ul"><li>Custom branded cover design</li><li>Professional multi-page interior layout</li><li>Chapter header graphics and section dividers</li><li>Infographics, diagrams, and visual summaries</li><li>Consistent typography, colour palette, and spacing</li><li>Mobile-readable layout and export-ready PDF</li></ul></div><div class="card cb-card"><span class="cb-ico">📦</span><h3>Delivery &amp; Assets</h3><ul class="cb-ul"><li>Final PDF in print-ready and web-optimised formats</li><li>Flipbook conversion if requested</li><li>Editable source file (Canva or equivalent)</li><li>Social media mockup images for promotion</li><li>Suggested opt-in page headline and copy</li><li>Revision rounds until you are completely satisfied</li></ul></div></div></section><section class="cb-sec"><p class="eb">Output formats</p><h2 class="cb-h">Three formats. One decision.</h2><p class="cb-sub">Choose the format that fits your distribution strategy — or ask for all three. Each serves a different purpose and audience expectation.</p><div class="cb-grid"><div class="card cb-card"><span class="cb-ico">📖</span><h3>PDF Guide</h3><p>The standard for lead magnets and downloadable resources. Fast to download, easy to read on any device, and simple to share. Professional layout with branded cover, interior design, and print-ready export.</p><span class="cb-tag sm" style="margin:10px 0 0">Best for: lead magnets, workbooks, guides</span></div><div class="card cb-card"><span class="cb-ico">🧲</span><h3>Interactive Flipbook</h3><p>A digital flipbook with realistic page-turn animation hosted online. Ideal for sharing via link, embedding on landing pages, and creating a premium impression. Higher perceived value than a flat PDF.</p><span class="cb-tag sm" style="margin:10px 0 0">Best for: premium lead magnets, brand positioning</span></div><div class="card cb-card"><span class="cb-ico">📄</span><h3>Fillable Workbook</h3><p>An interactive PDF with form fields, checkboxes, and fillable text areas — readers can complete exercises directly in the document without printing. Perfect for coaching programmes and online courses.</p><span class="cb-tag sm" style="margin:10px 0 0">Best for: courses, workshops, coaching programmes</span></div></div></section><section class="cb-sec"><p class="eb">How it works</p><h2 class="cb-h">From brief to published eBook in five steps.</h2><p class="cb-sub">A clear process so you know what to expect at every stage — and when your eBook lands in your inbox ready to publish.</p><div class="cb-grid"><div class="card cb-card"><span class="cb-ico">1️⃣</span><h3>Brief &amp; Strategy</h3><p>I define your audience, goal, topic, tone, and preferred format with you. You complete a short brief — I handle everything from there.</p></div><div class="card cb-card"><span class="cb-ico">2️⃣</span><h3>Outline Approval</h3><p>I create a full chapter outline and table of contents for your review before any writing begins. No surprises mid-project.</p></div><div class="card cb-card"><span class="cb-ico">3️⃣</span><h3>Writing &amp; Draft</h3><p>The full eBook is written in your voice. You receive the draft copy for review before design begins — feedback incorporated without friction.</p></div><div class="card cb-card"><span class="cb-ico">4️⃣</span><h3>Design &amp; Layout</h3><p>Copy is laid into the professional design template, custom graphics are created, and the eBook takes its final form. You approve the final design.</p></div><div class="card cb-card"><span class="cb-ico">5️⃣</span><h3>Delivery &amp; Assets</h3><p>Final PDF, editable source file, mockup images, and suggested opt-in copy are delivered. You publish and start building your list.</p></div></div></section><section class="cb-sec"><p class="eb">Common questions</p><h2 class="cb-h">Answered before you ask.</h2><div class="cb-faq"><details class="card cb-q"><summary>What if I already have content — can you just design it?</summary><p>Absolutely. If you have existing content — whether that is a rough draft, blog posts, course transcripts, or speaker notes — I can take that raw material, restructure it into a coherent eBook, clean up the copy, and produce the full design. Design-only projects are also available if your copy is already finalised and polished.</p></details><details class="card cb-q"><summary>How long does an eBook project take?</summary><p>Most projects are completed in 5–10 business days depending on length and complexity. A short lead magnet (10–20 pages) typically takes 5–7 days. A longer framework eBook or whitepaper (40–60 pages) takes 8–12 days. Rush delivery is available for an additional fee — just ask and I will confirm availability.</p></details><details class="card cb-q"><summary>Will the eBook sound like me, or like AI?</summary><p>It will sound like you — that is a non-negotiable part of how I work. Every eBook project starts with a voice and tone discovery process where I study how you write and communicate. AI tools are used for research, structure, and efficiency — but all final copy is written, edited, and reviewed by a human to ensure it sounds authentic and specific to you.</p></details><details class="card cb-q"><summary>How many revisions are included?</summary><p>Revisions are included until you are satisfied — there is no hard limit. In practice, most projects require one or two rounds of minor feedback after the draft is delivered. Structural changes after outline approval or significant scope changes may be quoted separately, but I will always communicate that clearly before proceeding.</p></details><details class="card cb-q"><summary>Do I get the editable source file?</summary><p>Yes — the editable source file (Canva or equivalent) is included in every project. This means you can make minor updates, change a page, or add a chapter in the future without needing to come back for every small change. The final PDF in both print-ready and web-optimised versions is also included as standard.</p></details><details class="card cb-q"><summary>Can you also create the opt-in landing page to distribute it?</summary><p>Yes — landing page copywriting and build is available as an add-on to any eBook project. I can write the opt-in page headline, body copy, and button text, and build the actual page if needed. Email automation setup (connecting the form to a welcome sequence) is also available. Ask for a bundled quote when you reach out.</p></details></div></section><section class="card cb-close"><p class="eb" style="margin-bottom:12px">Ready to start</p><h2 class="cb-h" style="margin:0 auto 8px">Your expertise deserves a home worth sharing.</h2><p class="cb-sub" style="margin:0 auto 16px">Tell me what you have in mind — topic, format, audience, and goal — and I will send you a clear quote within one business day.</p><div class="cb-btns"><a class="btn cb-btn " href="https://form.jotform.com/261806992939071" target="_blank" rel="noopener noreferrer">Get a free quote assessment and call</a></div><div style="margin-top:16px"><ul class="cb-chips"><li>✓ Writing + design in one</li><li>✓ Delivered in 5–10 days</li><li>✓ Sounds like you, not AI</li><li>✓ Editable source file included</li></ul></div></section>`;

const pos=mk(3,0),col=mk(3,1),siz=mk(1,1),alp=mk(1,1);geo.setAttribute('position',pos);geo.setAttribute('aCol',col);geo.setAttribute('aSize',siz);geo.setAttribute('aAlpha',alp);
const mat=new THREE.ShaderMaterial({uniforms:{uSize:{value:.052},uScale:{value:300},uNear:{value:5},uFar:{value:19},uFade:{value:.9},uCore:{value:.4},uGain:{value:1}},vertexShader:VS,fragmentShader:FS,transparent:true,depthWrite:false,depthTest:false});
const pts=new THREE.Points(geo,mat);pts.frustumCulled=false;sc.add(pts);
function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();mat.uniforms.uScale.value=R.domElement.height/(2*Math.tan(cam.fov*Math.PI/360))}
size();addEventListener('resize',size);
const rgb=h=>[(h>>16)/255,((h>>8)&255)/255,(h&255)/255],clamp=(x,a,b)=>Math.min(b,Math.max(a,x)),mix3=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const ns=new SimplexNoise(),GXs=new Float32Array(N),GZs=new Float32Array(N);
for(let j=0;j<GZ;j++)for(let i=0;i<GX;i++){GXs[j*GX+i]=(i/(GX-1)-.5)*16;GZs[j*GX+i]=(j/(GZ-1))*12.4-9.4}
const pale=rgb(0xa9cdff),blue=rgb(0x0a6cff),ink=rgb(0x0b2f7a);
const rc=new THREE.Raycaster(),pl=new THREE.Plane(new THREE.Vector3(0,1,0),0),hit=new THREE.Vector3(),ndc=new THREE.Vector2();
let tx=0,ty=0,bx=0,bz=-1.5;addEventListener('pointermove',e=>{tx=e.clientX/innerWidth-.5;ty=e.clientY/innerHeight-.5});
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;let drawn=false;const t0=performance.now();
const pa=pos.array,ca=col.array,sa=siz.array,aa=alp.array;
function frame(now){requestAnimationFrame(frame);if(still&&drawn)return;drawn=true;const t=(now-t0)/1000;
cam.updateMatrixWorld();ndc.set(tx*2,-ty*2);rc.setFromCamera(ndc,cam);const h0=rc.ray.intersectPlane(pl,hit);const gx=h0?h0.x:bx,gz=h0?h0.z:bz;bx+=(gx-bx)*.12;bz+=(gz-bz)*.12;
for(let i=0;i<N;i++){const x=GXs[i],z=GZs[i];const h=.3*Math.sin(x*.75+t)*Math.cos(z*.62-t*.7)+.2*ns.noise3d(x*.32,z*.32,t*.22)+.07*Math.sin((x+z)*1.5-t*1.4);
const dx=x-bx,dz=z-bz,d2=dx*dx+dz*dz,bump=Math.exp(-d2/.9)*.95+Math.sin(Math.sqrt(d2)*5-t*4.5)*Math.exp(-d2/3)*.07,y=h+bump,tt=clamp((y+.35)/1.4,0,1);
const c=tt<.5?mix3(pale,blue,tt*2):mix3(blue,ink,(tt-.5)*2),i3=i*3;pa[i3]=x;pa[i3+1]=y;pa[i3+2]=z;ca[i3]=c[0];ca[i3+1]=c[1];ca[i3+2]=c[2];sa[i]=.75+tt;aa[i]=.5+tt*.45}
pos.needsUpdate=col.needsUpdate=siz.needsUpdate=alp.needsUpdate=true;R.render(sc,cam)}
requestAnimationFrame(frame);
}catch(e){console.warn('Terrain background unavailable',e)}}
</script>

<script>
(()=>{const NAME="user_consent",box=document.getElementById("cc");if(!box)return;
 const read=()=>{const m=document.cookie.match(new RegExp("(?:^|; )"+NAME+"=([^;]*)"));let v=m?decodeURIComponent(m[1]):null;
  if(!v){try{v=localStorage.getItem(NAME)}catch(e){}}return v};          // localStorage fallback (e.g. file:// previews)
 const save=v=>{const d=new Date();d.setFullYear(d.getFullYear()+5);                       // expires in 5 years
  document.cookie=NAME+"="+encodeURIComponent(v)+"; expires="+d.toUTCString()+"; max-age="+60*60*24*365*5+"; path=/; SameSite=Lax"+(location.protocol==="https:"?"; Secure":"");
  try{localStorage.setItem(NAME,v)}catch(e){}};
 if(read()){box.remove();return}                                                                // already chose -> never show again
 const hide=()=>{box.classList.remove("show");document.body.classList.remove("cc-open");setTimeout(()=>box.remove(),700)};
 box.addEventListener("click",e=>{const b=e.target.closest("[data-cc]");if(b){save(b.dataset.cc);window.dispatchEvent(new CustomEvent("cookieconsent",{detail:b.dataset.cc}));hide();return}
  });                                          // privacy link is a placeholder
 const show=()=>{box.hidden=false;document.body.style.setProperty("--cc-h",box.offsetHeight+"px");document.body.classList.add("cc-open");requestAnimationFrame(()=>requestAnimationFrame(()=>box.classList.add("show")))};
 const wait=()=>document.getElementById("intro")?setTimeout(wait,300):setTimeout(show,500);    // appear after the intro has finished
 wait()})();
</script>
